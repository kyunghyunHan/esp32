[package]
name = "blog_writer"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
eframe = "0.34.1"
reqwest = { version = "0.13.3", features = ["blocking", "form", "json", "multipart"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
urlencoding = "2.1.3"
webbrowser = "1.0.6"
